<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoneyTrack · Finanzas personales</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f5;color:#202d26;font:14px/1.5 system-ui,sans-serif}.app{width:min(1080px,calc(100% - 34px));margin:38px auto}.head{display:flex;justify-content:space-between;align-items:center}.logo{font-size:20px;font-weight:800;letter-spacing:-.04em}.logo span{color:#31a776}.month{font-size:12px;color:#87938b}.title{margin:28px 0 18px}.title h1{font-size:30px;letter-spacing:-.05em;margin:0}.title p{margin:4px 0;color:#7d8981}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.metric,.box{background:#fff;border:1px solid #e7ece8;border-radius:12px;padding:20px}.metric span{color:#808c83;font-size:12px}.metric strong{display:block;font-size:26px;margin-top:7px;letter-spacing:-.04em}.metric:nth-child(1) strong{color:#27835d}.metric:nth-child(2) strong{color:#d57562}.metric:nth-child(3) strong{color:#394d43}.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:14px}.box h2{font-size:15px;margin:0 0 16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:20px}.form input,.form select{padding:10px;border:1px solid #dfe6e0;border-radius:6px;font:inherit}.form button{grid-column:1/-1;padding:10px;border:0;border-radius:6px;background:#287957;color:#fff;font:600 13px system-ui;cursor:pointer}.row{display:grid;grid-template-columns:1fr auto auto;gap:12px;border-top:1px solid #eff2ef;padding:12px 0;align-items:center}.row small{display:block;color:#9aa39c}.amount.income{color:#27835d}.amount.expense{color:#c76c5d}.remove{border:0;background:none;color:#a8b0aa;cursor:pointer;font-size:17px}.chartbox{min-height:280px}.disclaimer{font-size:11px;color:#9ba49d;margin-top:12px}@media(max-width:700px){.metrics{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.metric{padding:14px}.metric strong{font-size:22px}}
</style></head><body><main class="app"><header class="head"><div class="logo">money<span>track</span></div><div class="month" id="month"></div></header><div class="title"><h1>Tu dinero, en perspectiva.</h1><p>Un vistazo claro a tus movimientos del mes.</p></div><section class="metrics"><div class="metric"><span>Ingresos</span><strong id="income"></strong></div><div class="metric"><span>Gastos</span><strong id="expense"></strong></div><div class="metric"><span>Disponible</span><strong id="balance"></strong></div></section><section class="layout"><div class="box"><h2>Movimientos recientes</h2><form class="form" id="form"><input required maxlength="50" placeholder="Descripción"><input required type="number" min="1" step="100" placeholder="Valor (COP)"><select id="kind"><option value="expense">Gasto</option><option value="income">Ingreso</option></select><select id="category"><option>Alimentación</option><option>Transporte</option><option>Hogar</option><option>Tecnología</option><option>Entretenimiento</option><option>Otros</option></select><button>+ Agregar movimiento</button></form><div id="rows"></div><div class="disclaimer">Datos de demostración; se guardan solo en este navegador.</div></div><div class="box chartbox"><h2>Gastos por categoría</h2><canvas id="chart"></canvas></div></section></main><script>
const KEY='moneytrack-demo-v1';let data=JSON.parse(localStorage.getItem(KEY)||'[{"id":1,"name":"Mercado","amount":385000,"kind":"expense","category":"Alimentación"},{"id":2,"name":"Transporte","amount":120000,"kind":"expense","category":"Transporte"},{"id":3,"name":"Servicios","amount":260000,"kind":"expense","category":"Hogar"},{"id":4,"name":"Pago mensual","amount":2500000,"kind":"income","category":"Otros"},{"id":5,"name":"Suscripción","amount":45000,"kind":"expense","category":"Tecnología"}]');const cop=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);document.querySelector('#month').textContent=new Intl.DateTimeFormat('es-CO',{month:'long',year:'numeric'}).format(new Date());let chart;function render(){const inc=data.filter(x=>x.kind==='income').reduce((s,x)=>s+x.amount,0),exp=data.filter(x=>x.kind==='expense').reduce((s,x)=>s+x.amount,0);income.textContent=cop(inc);expense.textContent=cop(exp);balance.textContent=cop(inc-exp);rows.innerHTML=data.slice().reverse().map(x=>`<div class="row"><div>${esc(x.name)}<small>${esc(x.category)}</small></div><strong class="amount ${x.kind}">${x.kind==='income'?'+':'−'}${cop(x.amount)}</strong><button class="remove" data-id="${x.id}">×</button></div>`).join('')||'<div class="disclaimer">Aún no hay movimientos.</div>';document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{data=data.filter(x=>x.id!==+b.dataset.id);save()});const cats={};data.filter(x=>x.kind==='expense').forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);if(chart)chart.destroy();if(window.Chart)chart=new Chart(document.querySelector('#chart'),{type:'doughnut',data:{labels:Object.keys(cats),datasets:[{data:Object.values(cats),backgroundColor:['#54a77f','#e8ae65','#7998d5','#d77969','#8a78c4','#9aa69c'],borderWidth:0}]},options:{plugins:{legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:8,padding:15,font:{size:11}}}}}})}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}document.querySelector('#form').onsubmit=e=>{e.preventDefault();const f=e.target;data.push({id:Date.now(),name:f[0].value.trim(),amount:+f[1].value,kind:kind.value,category:category.value});f.reset();save()};render();</script></body></html>
