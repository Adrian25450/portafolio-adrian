<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockLite · Inventario</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#202a38;font:14px/1.5 system-ui,sans-serif}.app{width:min(1020px,calc(100% - 32px));margin:40px auto}.head{display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:800;letter-spacing:-.05em}.logo span{color:#3778d5}.eyebrow{font-size:11px;color:#8b95a4;letter-spacing:.12em;text-transform:uppercase}.title{margin:28px 0 20px}.title h1{font-size:32px;letter-spacing:-.06em;margin:0}.title p{margin:4px 0;color:#8791a0}.stats{display:flex;gap:10px;margin-bottom:14px}.stat{padding:12px 16px;background:white;border:1px solid #e7ebf1;border-radius:8px;flex:1}.stat small{display:block;color:#8a94a1}.stat strong{font-size:18px}.panel{background:#fff;border:1px solid #e7ebf1;border-radius:11px;padding:20px}.controls{display:flex;gap:9px;margin-bottom:15px}.controls input,.controls select,.modal input{border:1px solid #dfe4eb;padding:10px;border-radius:6px;font:inherit}.controls input{flex:1}.btn{border:0;border-radius:6px;padding:10px 15px;background:#3475d2;color:#fff;font:600 13px system-ui;cursor:pointer}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;min-width:520px}th{font-size:11px;color:#8993a1;font-weight:600;padding:12px 10px;border-bottom:1px solid #edf0f4}td{padding:13px 10px;border-bottom:1px solid #f0f2f5}.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#e9f6ef;color:#33865c}.badge.low{background:#fff2df;color:#b87821}.action{border:0;background:none;color:#76839a;cursor:pointer}.empty{text-align:center;color:#8f98a6;padding:35px}.modal{display:none;position:fixed;inset:0;background:#141a2566;place-items:center;padding:15px}.modal.open{display:grid}.dialog{background:#fff;padding:23px;border-radius:12px;width:min(400px,100%)}.dialog h2{margin:0 0 15px}.dialog input{width:100%;margin:5px 0}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.dialog-actions button{border:1px solid #dce2eb;background:#fff;border-radius:6px;padding:9px 13px;cursor:pointer}.dialog-actions button:last-child{background:#3475d2;color:white;border-color:#3475d2}.foot{font-size:11px;color:#9aa2ae;margin:12px 3px}@media(max-width:550px){.controls{flex-wrap:wrap}.controls input{flex-basis:100%}.stats{gap:5px}.stat{padding:10px}.stat strong{font-size:15px}}
</style></head><body><main class="app"><header class="head"><div class="logo">stock<span>lite</span></div><span class="eyebrow">Inventario · Demo</span></header><div class="title"><h1>Inventario</h1><p>Control sencillo de tus productos y existencias.</p></div><div class="stats"><div class="stat"><small>Productos</small><strong id="total">—</strong></div><div class="stat"><small>Unidades</small><strong id="units">—</strong></div><div class="stat"><small>Bajo stock</small><strong id="lowcount">—</strong></div></div><section class="panel"><div class="controls"><input id="search" placeholder="Buscar producto…"><select id="filter"><option value="all">Todos los estados</option><option value="available">Disponible</option><option value="low">Bajo stock</option></select><button class="btn" id="add">+ Agregar producto</button></div><div class="tablewrap"><table><thead><tr><th>PRODUCTO</th><th>CATEGORÍA</th><th>CANTIDAD</th><th>ESTADO</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div><div class="foot">Los cambios se guardan localmente en este navegador. Bajo stock: 5 unidades o menos.</div></section></main><div class="modal" id="modal"><form class="dialog" id="form"><h2 id="formtitle">Agregar producto</h2><input id="name" placeholder="Nombre del producto" maxlength="60" required><input id="category" placeholder="Categoría" maxlength="35" required><input id="qty" type="number" min="0" placeholder="Cantidad" required><div class="dialog-actions"><button type="button" id="cancel">Cancelar</button><button>Guardar</button></div></form></div><script>
const KEY='stocklite-demo-v1';let products=JSON.parse(localStorage.getItem(KEY)||'[{"id":1,"name":"Portátil","category":"Cómputo","qty":4},{"id":2,"name":"Mouse","category":"Accesorios","qty":12},{"id":3,"name":"Teclado","category":"Accesorios","qty":8},{"id":4,"name":"Monitor","category":"Cómputo","qty":3}]'),editId=null;const modal=document.querySelector('#modal');function render(){total.textContent=products.length;units.textContent=products.reduce((a,p)=>a+p.qty,0);lowcount.textContent=products.filter(p=>p.qty<=5).length;const q=search.value.toLowerCase(),f=filter.value;let list=products.filter(p=>p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)).filter(p=>f==='all'||(f==='low'?p.qty<=5:p.qty>5));tbody.innerHTML=list.length?list.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(p.category)}</td><td>${p.qty}</td><td><span class="badge ${p.qty<=5?'low':''}">${p.qty<=5?'Bajo stock':'Disponible'}</span></td><td><button class="action" data-edit="${p.id}">Editar</button> · <button class="action" data-del="${p.id}">Eliminar</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No se encontraron productos.</td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>open(+b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{products=products.filter(p=>p.id!==+b.dataset.del);save()})}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem(KEY,JSON.stringify(products));render()}function open(id=null){editId=id;let p=products.find(x=>x.id===id);document.querySelector('#formtitle').textContent=p?'Editar producto':'Agregar producto';name.value=p?.name||'';category.value=p?.category||'';qty.value=p?.qty??'';modal.classList.add('open');name.focus()}document.querySelector('#add').onclick=()=>open();document.querySelector('#cancel').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.querySelector('#form').onsubmit=e=>{e.preventDefault();const item={id:editId||Date.now(),name:name.value.trim(),category:category.value.trim(),qty:+qty.value};if(editId)products=products.map(p=>p.id===editId?item:p);else products.push(item);modal.classList.remove('open');save()};search.oninput=render;filter.onchange=render;render();</script></body></html>
