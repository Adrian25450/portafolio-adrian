<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WeatherApp · El clima</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eaf0f6;color:#26364b;font:15px/1.5 system-ui,sans-serif;display:grid;place-items:center;padding:20px}.app{width:min(750px,100%);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 25px 70px #344b6421}.head{padding:25px 30px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:800;letter-spacing:-.04em}.logo span{color:#589ad1}.tag{font-size:11px;color:#91a1b2}.search{background:#f4f7fa;padding:13px 30px;display:flex;gap:9px}.search input{flex:1;min-width:0;padding:12px;border:1px solid #dde5ed;border-radius:8px;font:inherit}.search button{border:0;background:#3f91ce;color:#fff;padding:0 18px;border-radius:8px;font-weight:700;cursor:pointer}.weather{padding:34px 38px 38px;background:linear-gradient(135deg,#edf7fc,#d7ebf6);position:relative}.place{font-size:20px;font-weight:700}.date{font-size:12px;color:#7c91a3}.mainrow{display:flex;align-items:center;gap:24px;margin:17px 0 24px}.icon{font-size:67px}.temp{font-size:74px;letter-spacing:-.08em;line-height:1;font-weight:700}.desc{font-size:15px;color:#687f91}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.detail{background:#ffffffa8;border:1px solid #ffffffc9;border-radius:10px;padding:14px}.detail small{display:block;color:#8396a6}.detail strong{display:block;margin-top:5px;font-size:17px}.message{font-size:12px;color:#6e8295;margin-top:17px;min-height:18px}.credit{font-size:10px;color:#94a2ae;padding:13px 30px}.credit a{color:#589ad1}@media(max-width:500px){.weather{padding:25px 20px}.search{padding:12px 18px}.head{padding:20px}.details{grid-template-columns:1fr}.detail{display:flex;justify-content:space-between}.mainrow{gap:12px}.temp{font-size:60px}}
</style></head><body><main class="app"><header class="head"><div class="logo">weather<span>app</span></div><div class="tag">EL TIEMPO AHORA</div></header><form class="search" id="form"><input id="city" placeholder="Escribe una ciudad, ej. Cartago" value="Cartago" required><button>Consultar</button></form><section class="weather"><div class="place" id="place">Cartago, Colombia</div><div class="date" id="date"></div><div class="mainrow"><div class="icon" id="icon">⛅</div><div><div class="temp" id="temp">--°</div><div class="desc" id="desc">Consultando el clima…</div></div></div><div class="details"><div class="detail"><small>Sensación</small><strong id="feels">--°</strong></div><div class="detail"><small>Humedad</small><strong id="humidity">--%</strong></div><div class="detail"><small>Viento</small><strong id="wind">-- km/h</strong></div></div><div class="message" id="message"></div></section><div class="credit">Datos meteorológicos de <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a>. Requiere conexión a internet.</div></main><script>
const codes={0:['☀️','Despejado'],1:['🌤️','Mayormente despejado'],2:['⛅','Parcialmente nublado'],3:['☁️','Nublado'],45:['🌫️','Neblina'],48:['🌫️','Neblina'],51:['🌦️','Llovizna ligera'],53:['🌦️','Llovizna'],55:['🌧️','Llovizna intensa'],61:['🌦️','Lluvia ligera'],63:['🌧️','Lluvia'],65:['🌧️','Lluvia fuerte'],80:['🌦️','Chubascos'],81:['🌧️','Chubascos'],82:['⛈️','Chubascos fuertes'],95:['⛈️','Tormenta']};date.textContent=new Intl.DateTimeFormat('es-CO',{weekday:'long',day:'numeric',month:'long'}).format(new Date());async function loadCity(query){message.textContent='Buscando ubicación…';try{const g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=es&format=json`);if(!g.ok)throw 0;const loc=(await g.json()).results?.[0];if(!loc){message.textContent='No encontramos esa ciudad. Prueba con otro nombre.';return}message.textContent='Consultando condiciones actuales…';const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`);if(!r.ok)throw 0;const c=(await r.json()).current;place.textContent=[loc.name,loc.admin1,loc.country].filter(Boolean).join(', ');temp.textContent=Math.round(c.temperature_2m)+'°';feels.textContent=Math.round(c.apparent_temperature)+'°';humidity.textContent=c.relative_humidity_2m+'%';wind.textContent=Math.round(c.wind_speed_10m)+' km/h';const w=codes[c.weather_code]||['🌡️','Condiciones actuales'];icon.textContent=w[0];desc.textContent=w[1];message.textContent='';}catch{message.textContent='No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.'}}document.querySelector('#form').onsubmit=e=>{e.preventDefault();loadCity(city.value.trim())};loadCity('Cartago');</script></body></html>
