<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow · Tareas</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#202a3b;font:15px/1.5 system-ui,sans-serif}.app{width:min(920px,calc(100% - 32px));margin:55px auto}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800;letter-spacing:-.04em}.brand span{color:#6656d9}.date{font-size:12px;color:#81899b}.card{background:#fff;border:1px solid #e8eaf1;border-radius:14px;padding:25px;margin-top:20px;box-shadow:0 12px 35px #252c3b09}.intro{background:linear-gradient(120deg,#edeaff,#f3f1ff)}h1{font-size:34px;letter-spacing:-.06em;margin:0}.intro p{margin:6px 0;color:#747c8c}.form{display:flex;gap:9px;margin-top:22px}.form input{flex:1;min-width:0;border:1px solid #dfe2eb;border-radius:7px;padding:12px;font:inherit}.form button{border:0;border-radius:7px;background:#6555d9;color:white;padding:0 18px;font:600 14px system-ui;cursor:pointer}.filters{display:flex;gap:8px;margin:22px 0}.filters button{background:white;border:1px solid #e4e6ee;padding:7px 12px;border-radius:20px;color:#687184;cursor:pointer}.filters button.active{background:#eeeaff;color:#5443cd;border-color:#d8d2ff}.row{display:flex;align-items:center;gap:12px;padding:15px 0;border-top:1px solid #eff0f4}.row input{accent-color:#6254d5;width:17px;height:17px}.task{flex:1}.done .task{text-decoration:line-through;color:#a4a9b3}.del{border:0;background:transparent;color:#b0b4bd;font-size:19px;cursor:pointer}.del:hover{color:#dc5364}.empty{text-align:center;padding:32px;color:#9299a7}.foot{font-size:11px;color:#9aa0ac;margin-top:12px}@media(max-width:520px){.app{margin:25px auto}.form{flex-wrap:wrap}.form input{flex-basis:100%;padding:12px}.form button{padding:11px 15px}}
</style></head><body><main class="app"><div class="top"><div class="brand">task<span>flow</span></div><div class="date" id="date"></div></div><section class="card intro"><h1>Un paso a la vez.</h1><p>Organiza lo que sigue y celebra lo que ya hiciste.</p><form class="form" id="form"><input id="newtask" maxlength="100" placeholder="¿Qué necesitas hacer?" required><button>+ Agregar tarea</button></form></section><section class="card"><div class="top"><strong>Mis tareas</strong><span class="date" id="count"></span></div><div class="filters"><button class="active" data-filter="all">Todas</button><button data-filter="pending">Pendientes</button><button data-filter="done">Completadas</button></div><div id="list"></div><div class="foot">Tus tareas se guardan en este navegador.</div></section></main><script>
const KEY='taskflow-demo-v1';let tasks=JSON.parse(localStorage.getItem(KEY)||'[{"id":1,"text":"Terminar mi portafolio","done":false},{"id":2,"text":"Estudiar JavaScript","done":true}]');let filter='all';const save=()=>{localStorage.setItem(KEY,JSON.stringify(tasks));render()};document.querySelector('#date').textContent=new Intl.DateTimeFormat('es-CO',{dateStyle:'long'}).format(new Date());function render(){const items=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));document.querySelector('#count').textContent=`${tasks.filter(t=>!t.done).length} pendientes`;document.querySelector('#list').innerHTML=items.length?items.map(t=>`<div class="row ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} aria-label="Completar"><span class="task">${escapeHtml(t.text)}</span><button class="del" aria-label="Eliminar">×</button></div>`).join(''):'<div class="empty">No hay tareas en esta lista.</div>';document.querySelectorAll('.row').forEach((el,i)=>{const t=items[i];el.querySelector('input').onchange=()=>{t.done=!t.done;save()};el.querySelector('.del').onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save()}})}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.querySelector('#form').onsubmit=e=>{e.preventDefault();tasks.unshift({id:Date.now(),text:document.querySelector('#newtask').value.trim(),done:false});e.target.reset();save()};document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('active',x===b));render()});render();</script></body></html>
